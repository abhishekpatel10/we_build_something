worker_processes auto;
events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Tuning
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    keepalive_requests 10000;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting Zones (Step 4 & Phase 1)
    # Write API rate limit: 100 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_write_limit:10m rate=100r/s;
    # Read/Redirect rate limit: 1,000 requests per second per IP
    limit_req_zone $binary_remote_addr zone=redirect_read_limit:20m rate=1000r/s;

    # Upstream Clusters for Microservice Separation (Deep Dive 3)
    upstream bitly_write_cluster {
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream bitly_read_cluster {
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream bitly_frontend {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static Assets & React Dashboard
        location / {
            limit_req zone=redirect_read_limit burst=200 nodelay;
            proxy_pass http://bitly_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Write & Management endpoints: POST /api/v1/urls
        location /api/v1/urls {
            limit_req zone=api_write_limit burst=50 nodelay;
            proxy_pass http://bitly_write_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API endpoints
        location /api/ {
            proxy_pass http://bitly_read_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Short Code Redirection Path: GET /{shortCode}
        # Optimized for maximum redirect throughput with sub-millisecond connection reuse
        location ~ ^/[a-zA-Z0-9_-]+$ {
            limit_req zone=redirect_read_limit burst=500 nodelay;
            proxy_pass http://bitly_read_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Pass cache headers back to client
            proxy_pass_header X-Cache-Status;
            proxy_pass_header X-Response-Time;
        }
    }
}
