# ==============================================================================
# Production Nginx Configuration for Bitly Fullstack Deployment
# Location: /etc/nginx/sites-available/bitly (symlink to /etc/nginx/sites-enabled/)
# ==============================================================================

# Rate Limiting Zones (Leaky Bucket)
# Write API: 100 requests per second per IP
limit_req_zone $binary_remote_addr zone=bitly_api_write:10m rate=100r/s;
# Redirect Read & Frontend: 1,000 requests per second per IP
limit_req_zone $binary_remote_addr zone=bitly_redirect_read:20m rate=1000r/s;

# Upstream Node.js Backend Cluster
upstream bitly_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect Server Block (Uncomment when SSL is installed)
# ------------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ------------------------------------------------------------------------------
# Main Server Block (Port 80 for Initial Setup / Port 443 with SSL)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;

    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (Managed via Certbot: certbot --nginx -d yourdomain.com)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Frontend Static Root (Path to compiled React application)
    root /var/www/bitly/frontend/dist;
    index index.html;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 1. API Write Endpoints: POST /api/v1/urls
    location /api/v1/urls {
        limit_req zone=bitly_api_write burst=50 nodelay;
        proxy_pass http://bitly_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. General API Endpoints: /api/*
    location /api/ {
        limit_req zone=bitly_redirect_read burst=100 nodelay;
        proxy_pass http://bitly_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. High-Throughput Short URL Redirection: GET /{shortCode}
    # Matches /a-zA-Z0-9_- (e.g. /xk92L, /launch2026) and proxies to Node backend
    location ~ ^/[a-zA-Z0-9_-]+$ {
        limit_req zone=bitly_redirect_read burst=500 nodelay;
        proxy_pass http://bitly_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass latency & cache status headers back
        proxy_pass_header X-Cache-Status;
        proxy_pass_header X-Response-Time;
    }

    # 4. React Hashed Static Assets (Cache immutable for 1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 5. Media & Icons
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 6. React SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
