version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL: Relational metadata store for Workspaces, Files, & Chunks
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dropbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dropbox_db}
      POSTGRES_USER: ${POSTGRES_USER:-dropbox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropbox_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dropbox_user} -d ${POSTGRES_DB:-dropbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # MinIO: High-performance S3-compatible Object Storage for raw chunks
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: dropbox_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web Dashboard
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # MinIO Bucket Auto-Provisioner & CORS Setup
  # -------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: dropbox_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-dropbox-files} &&
      echo 'Bucket ${MINIO_BUCKET_NAME:-dropbox-files} created or already exists.' &&
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-dropbox-files} || true &&
      exit 0;
      "

volumes:
  postgres_data:
    name: dropbox_postgres_data
  minio_data:
    name: dropbox_minio_data
